name: FastTag
description: "Fast scene tagging workflow for Stash: edit tags, performers, studios, and galleries from scene cards with smart suggestions, bulk tagging, and sequential navigation"
version: "4.4.9"
ui:
  javascript:
    - tabulator.min.js
    - fasttag-core.js
    - fasttag-entities.js
    - fasttag-storage.js
    - fasttag-diagnostics.js
    - fasttag-api.js
    - fasttag-notifications.js
    - fasttag-settings.js
    - fasttag-integrations.js
    - fasttag-library-manager.js
    - fasttag-gemini.js
    - fasttag-scraper.js
    - fasttag-scraper-ui.js
    - fasttag-scraper-controller.js
    - fasttag-preview.js
    - fasttag-cover-editor.js
    - fasttag-ui.js
    - fasttag-popup.js
    - fasttag-editors.js
    - fasttag-workflows.js
    - fasttag.js
  css:
    - tabulator.min.css
  assets:
    /: .
exec:
  - python3
  - "{pluginDir}/fasttag_task.py"
interface: raw
tasks:
  - name: Start Gemini Bridge
    description: Spawns the lightweight Gemini AI bridge.
    execArgs:
      - start
  - name: Stop Gemini Bridge
    description: Stops the Gemini AI bridge.
    execArgs:
      - stop
