name: FastTag
description: "Fast scene tagging workflow for Stash: edit tags, performers, studios, and galleries from scene cards with smart suggestions, bulk tagging, and sequential navigation"
version: "4.2.2"
ui:
  javascript:
    - tabulator.min.js
    - fasttag.js
  css:
    - tabulator.min.css
exec:
  - python3
  - "{pluginDir}/fasttag_task.py"
interface: raw
tasks:
  - name: Start Gemini Bridge
    description: Spawns the lightweight Gemini AI bridge.
    execArgs:
      - start
  - name: Stop Gemini Bridge
    description: Stops the Gemini AI bridge.
    execArgs:
      - stop
