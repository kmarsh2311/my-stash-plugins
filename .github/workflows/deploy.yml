name: Deploy repository to Github Pages

on:
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: '0'
    - run: |
        mkdir -p _site/${{ github.ref_name }}
        cp index.yml fasttag.zip _site/ 2>/dev/null || true
        cp index.yml fasttag.zip _site/${{ github.ref_name }}/ 2>/dev/null || true
    - uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: '${{ steps.deployment.outputs.page_url }}main/index.yml'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
